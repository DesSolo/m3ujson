version: 2

before:
  hooks:
    - make tidy

builds:
  - main: cmd/main.go
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - 386
      - mips64
      - mips64le
      - mips
      - mipsle
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w

archives:
  - formats: zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
